services:
  db:
    image: postgres:16-alpine
    container_name: recall_talk_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altere-esta-senha-segura}
      POSTGRES_DB: ${POSTGRES_DB:-recall_talk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recall_talk}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
