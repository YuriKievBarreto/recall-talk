[project]
name = "recall-talk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "boto3>=1.43.114",
    "fastapi>=0.143.3",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-aws>=1.9.0",
    "langgraph>=1.2.15",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload --port 8000"
test = "pytest"

